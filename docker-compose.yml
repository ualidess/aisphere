services:
  db:
    image: postgres:16-alpine
    container_name: avatar_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aisphere}
      POSTGRES_USER: ${POSTGRES_USER:-aisphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisphere_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisphere} -d ${POSTGRES_DB:-aisphere}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - avatar_front_net

  backend:
    build: ./backend
    container_name: avatar_front_backend
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      SYSTEM_PROMPT: "${SYSTEM_PROMPT}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://aisphere:aisphere_password@db:5432/aisphere}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY}"
      ELEVENLABS_VOICE_ID: "${ELEVENLABS_VOICE_ID}"
      ELEVENLABS_TTS_MODEL: "${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}"
      ELEVENLABS_STT_MODEL: "${ELEVENLABS_STT_MODEL:-scribe_v1}"
      ELEVENLABS_OUTPUT_FORMAT: "${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8078,http://127.0.0.1:8078}"
      MAX_AUDIO_UPLOAD_BYTES: "${MAX_AUDIO_UPLOAD_BYTES:-10485760}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avatar_front_net

  frontend:
    image: nginx:alpine
    container_name: avatar_front_frontend
    ports:
      - "8078:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - avatar_front_net

volumes:
  postgres_data:

networks:
  avatar_front_net:
    driver: bridge