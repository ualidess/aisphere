services:
  backend:
    build: ./backend
    container_name: avatar_front_backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT}
    networks:
      - avatar_front_net

  frontend:
    image: nginx:alpine
    container_name: avatar_front_frontend
    ports:
      - "8078:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - avatar_front_net

networks:
  avatar_front_net:
    driver: bridge